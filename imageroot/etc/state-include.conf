#
# 2FAuth state/backup include patterns for Restic
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
# Restic --files-from: https://restic.readthedocs.io/en/stable/040_backup.html#including-files
#
# state/environment is always included. state/app.env and
# state/smarthost.env are generated again by configure-module and at
# service start.
#

# SQLite database, Passport keys, logs and uploaded icons
volumes/2fauth-app
volumes/2fauth-config
# APP_KEY: never lose it, the database content is encrypted with it
state/key.env
# OAuth client secrets and other secrets (mode 0600)
state/passwords.env
